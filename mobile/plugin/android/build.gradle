// mobile/plugin/android/build.gradle
//
// This becomes a Gradle module (":capacitor-gitfs") inside the Capacitor-
// generated `mobile/android/` project. It is copied into place and wired
// into settings.gradle / app/build.gradle by mobile/scripts/patch-android-native.js
// after `npx cap add android` runs in CI (see that script and the updated
// build-android-apk.yml workflow step "Inject native GitFs plugin").
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.manuscript.gitfs"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.documentfile:documentfile:1.0.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Native git implementation — replaces isomorphic-git + the
    // cors.isomorphic-git.org relay entirely on Android. Pure-Java,
    // Maven Central artifact, no native (.so) code, well-tested on Android
    // by other apps (e.g. MGit) for well over a decade.
    implementation "org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r"
    // JGit's HTTP transport needs an Apache HttpClient implementation on
    // platforms without java.net.http; this pulls in a compatible one for
    // Android's older java.net stack instead of relying on JDK 11's
    // HttpClient, which is not what Android's runtime actually provides.
    implementation "org.eclipse.jgit:org.eclipse.jgit.http.apache:6.10.0.202406032230-r"
}